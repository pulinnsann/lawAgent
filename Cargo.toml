[workspace]
members = ["native/law-core", "native/law-node", "native/law-desktop"]
default-members = ["native/law-core", "native/law-node"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/pulinnsann/lawAgent"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
