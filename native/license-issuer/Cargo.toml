[package]
name = "law-license-issuer"
version = "0.1.0"
edition.workspace = true
rust-version = "1.90"
license.workspace = true
repository.workspace = true
publish = false
default-run = "law-license-issuer"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
issuer-smoke = []

[[bin]]
name = "issuer-diagnostic"
path = "src/bin/issuer-diagnostic.rs"
required-features = ["issuer-smoke"]

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-single-instance = "=2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
ed25519-dalek = { version = "=2.2.0", features = ["pkcs8", "pem", "zeroize"] }
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Memory"] }

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
serde_json = "1"
