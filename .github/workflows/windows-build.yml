name: Manual Windows x64 Tauri build

# Manual only. Artifacts remain with this run; no public release is created.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: manual-windows-x64-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24 x64
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          architecture: x64
          cache: npm
      - name: Install locked dependencies including native optional packages
        run: npm ci --include=optional
      - name: Set up stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Build and validate native business storage
        run: |
          npm run native:binding
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run native:test:binding
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run native:test
      - name: Engineering regression tests
        run: npm test
      - name: Build portable review engine and frontend
        run: npm run build
      - name: Verify packaged Node, SQLite, Canvas, OCR and PDF assets
        run: |
          & ".local/tauri-runtime/bin/node.exe" scripts/verify-tauri-resources.mjs .local/tauri-runtime output/tauri-resource-inventory.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native desktop tests
        run: npm run native:test:desktop
      - name: Package unsigned Tauri NSIS installer
        run: npm run pack:win -- --ci
      - name: Collect verified installer and portable ZIP
        run: |
          $portable = "output/tauri-windows-portable"
          New-Item -ItemType Directory -Force $portable | Out-Null
          Copy-Item .local/rust-target/release/law-agent-desktop.exe "$portable/合同工作台.exe"
          Copy-Item -Recurse .local/tauri-runtime "$portable/runtime"
          Compress-Archive -Path "$portable/*" -DestinationPath output/law-agent-windows-x64-portable.zip
          $collected = node scripts/collect-desktop-installers.mjs --portable-zip output/law-agent-windows-x64-portable.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = $collected | ConvertFrom-Json
          "LAW_AGENT_RELEASE_DIR=$($result.releaseDirectory)" | Add-Content -Encoding utf8 $env:GITHUB_ENV
          Copy-Item output/tauri-resource-inventory.json "$($result.releaseDirectory)/tauri-resource-inventory.json"
      - name: Upload artifacts for manual review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: law-agent-tauri-windows-x64-${{ github.run_number }}
          path: ${{ env.LAW_AGENT_RELEASE_DIR }}/*
          if-no-files-found: error
          retention-days: 14
